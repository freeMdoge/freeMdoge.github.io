    function setGiscusTheme(theme) {
        let giscus = document.querySelector("iframe.giscus-frame");

                {

                        setConfig: {

                        },

                "https://giscus.app"
            );
        }

    (function () {
        addEventListener("message", (e) => {
            if (event.origin !== "https://giscus.app") return;
            handler();
        });
        window.addEventListener("onColorSchemeChange", handler);

        function handler() {
            if (document.documentElement.dataset.scheme === "light") {
                setGiscusTheme('light');
            } else {
                setGiscusTheme('dark_dimmed');
            }
        }
    })();

    function initTocHide() {

        }
        
        window.addEventListener('scroll', function() {
            
            let openUl = document.querySelectorAll(".open");
            if (openUl.length > 0) {
              openUl.forEach((ul) => {
                ul.classList.remove("open")
              })
            }
            
            let currentLi = document.querySelector(".active-class");
            if (!currentLi) {
                return
            }
            
            if (currentLi.children.length > 1) {
                currentLi.children[1].classList.add("open")
            }

                ul.classList.add("open");
                ul = ul.parentElement.parentElement
            } while (ul !== undefined && (ul.localName === 'ul' || ul.localName === 'ol'))

<script>
 let s1 = '2025-7-23'; 
 s1 = new Date(s1.replace(/-/g, "/"));
 let s2 = new Date();

 
 let diffInMilliseconds = s2.getTime() - s1.getTime();
 let totalDays = Math.floor(diffInMilliseconds / (1000 * 60 * 60 * 24));

 
 let years = s2.getFullYear() - s1.getFullYear();
 let months = s2.getMonth() - s1.getMonth();
 let days = s2.getDate() - s1.getDate();

 
 if (days < 0) {
   months -= 1;
   let prevMonth = new Date(s2.getFullYear(), s2.getMonth(), 0); 
   days += prevMonth.getDate();
 }
 if (months < 0) {
   years -= 1;
   months += 12;
 }

 
 let result = `${years}年${months}月${days}天`;
 document.getElementById('runningdays').innerHTML = result;
</script>

    const modalContainer = document.querySelector(`.json-canvas-modal-${item.name}`);
    
    if (container) {
        jsonCanvasList[item.name] = {
            main: new JSONCanvasViewer({
                container: container,
                canvas: await fetchCanvas(item.path),
                theme: theme,
                parser,
            }),
            path: item.path
        };
    }
}


document.querySelectorAll('.json-canvas-zoom-btn').forEach(btn => {
    btn.addEventListener('click', async function() {
        const canvasName = this.dataset.canvas;
        const modal = document.getElementById(`json-canvas-modal-${canvasName}`);
        
        if (modal) {
            
            if (!jsonCanvasList[canvasName]?.modal) {
                const modalContainer = document.querySelector(`.json-canvas-modal-${canvasName}`);
                if (modalContainer) {
                    
                    modal.style.display = 'flex';
                    document.documentElement.style.overflow = 'hidden';
                    
                    
                    await new Promise(resolve => requestAnimationFrame(resolve));
                    
                    
                    jsonCanvasList[canvasName].modal = new JSONCanvasViewer({
                        container: modalContainer,
                        canvas: await fetchCanvas(jsonCanvasList[canvasName].path),
                        theme: theme,
                        parser,
                    });
                }
            } else {
                
                modal.style.display = 'flex';
                document.documentElement.style.overflow = 'hidden';
                jsonCanvasList[canvasName].modal.resize();
            }
        }
    });
});


document.querySelectorAll('.json-canvas-modal-close').forEach(btn => {
    btn.addEventListener('click', function() {
        const canvasName = this.dataset.canvas;
        const modal = document.getElementById(`json-canvas-modal-${canvasName}`);
        if (modal) {
            modal.style.display = 'none';
            document.documentElement.style.overflow = '';
        }
    });
});


document.querySelectorAll('.json-canvas-modal-overlay').forEach(overlay => {
    overlay.addEventListener('click', function() {
        const modal = this.closest('.json-canvas-modal');
        if (modal) {
            modal.style.display = 'none';
            document.documentElement.style.overflow = '';
        }
    });
});


document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        document.querySelectorAll('.json-canvas-modal[style*="display: flex"]').forEach(modal => {
            modal.style.display = 'none';
            document.documentElement.style.overflow = '';
        });
    }
});


window.addEventListener('onColorSchemeChange', (e) => {
    for (const key in jsonCanvasList) {
        if (jsonCanvasList[key]?.main) {
            jsonCanvasList[key].main.changeTheme(e.detail);
        }
        if (jsonCanvasList[key]?.modal) {
            jsonCanvasList[key].modal.changeTheme(e.detail);
        }
    }
});
</script>


    </body>
</html>
